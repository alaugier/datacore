<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DATA CORE — Référence</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.2/markdown-it.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/latex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<style>
  :root {
    --accent: #1c7ed6;
    --bg: #ffffff;
    --bg-panel: #f8f9fb;
    --text: #1a1d23;
    --text-dim: #5c6370;
    --border: #e3e6ea;
    --code-bg: #282c34;
    --code-border: #3b4048;
    --code-ln: #7b8394;
    --mono: "JetBrains Mono", "Fira Code", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  header .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
  }
  header code {
    font-family: var(--mono);
    font-size: 0.95rem;
    color: var(--text);
  }
  header .badge {
    margin-left: auto;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  #status {
    color: var(--text-dim);
    font-size: 0.9rem;
    padding: 40px 0;
    text-align: center;
  }
  .markdown-body {
    line-height: 1.6;
    font-size: 0.98rem;
  }
  .markdown-body h1, .markdown-body h2, .markdown-body h3,
  .markdown-body h4, .markdown-body h5, .markdown-body h6 {
    color: var(--accent);
    line-height: 1.3;
    scroll-margin-top: 70px;
  }
  .markdown-body h1 { font-size: 1.6rem; margin-top: 0; }
  .markdown-body h2 { font-size: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .markdown-body h3 { font-size: 1.05rem; }
  .markdown-body code {
    font-family: var(--mono);
    background: var(--bg-panel);
    padding: 0.1em 0.35em;
    border-radius: 4px;
    font-size: 0.88em;
  }
  .markdown-body pre {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
  }
  .markdown-body pre code {
    background: none;
    padding: 0;
    font-size: 0.85em;
  }
  .markdown-body img { max-width: 100%; border-radius: 6px; }
  .markdown-body table {
    border-collapse: collapse;
    width: 100%;
    font-size: 0.9rem;
    margin: 1em 0;
  }
  .markdown-body th, .markdown-body td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  .markdown-body th { background: var(--bg-panel); }
  .markdown-body blockquote {
    border-left: 3px solid var(--accent);
    margin: 1em 0;
    padding: 0.2em 1em;
    color: var(--text-dim);
    background: var(--bg-panel);
  }
  .markdown-body a.broken-ref {
    color: #c92a2a;
    text-decoration: underline wavy;
    cursor: help;
  }
  .code-view pre {
    margin: 0;
    border-radius: 8px;
    border: 1px solid var(--code-border);
    font-size: 0.88rem;
  }
  .code-view pre code.hljs {
    padding: 16px 18px;
    border-radius: 8px;
  }
  .code-row {
    display: block;
    padding-left: 3px;
    border-left: 3px solid transparent;
  }
  .code-row .ln {
    display: inline-block;
    color: var(--code-ln);
    user-select: none;
    margin-right: 14px;
  }
  .line-marker {
    background: rgba(28, 126, 214, 0.28);
    border-left: 3px solid #74c0fc;
  }
  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.75rem;
    padding: 20px;
  }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <code id="file-label">…</code>
  <span class="badge" id="ext-badge"></span>
</header>
<main>
  <div id="status">Chargement…</div>
  <div id="content" class="markdown-body" style="display:none;"></div>
</main>
<footer>DATA CORE — preuve de code réelle, servie depuis le dépôt local</footer>

<script>
function getParams() {
  const p = new URLSearchParams(location.search);
  return { file: p.get("file") || "", line: parseInt(p.get("line") || "0", 10), anchor: p.get("anchor") || "" };
}

function extOf(name) {
  const m = name.match(/\.([a-zA-Z0-9]+)$/);
  return m ? m[1].toLowerCase() : "";
}

function safeDecode(s) {
  try { return decodeURIComponent(s); } catch (e) { return s; }
}

// Extensions this viewer can actually fetch (flat /refs/ symlink set) —
// anything else is left as a plain, inert reference rather than a dead link.
// .ipynb is deliberately excluded: notebooks embed base64 cell outputs
// (plots, images) that would render as unreadable JSON noise here, so a
// link to one is left as an inert broken-ref instead of a misleading link.
const FILE_EXT_RE = /\.(md|sql|py|sh|bash|yml|yaml|json|csv|tex|js|ts)$/i;

const LANG_BY_EXT = {
  py: "python", sh: "bash", bash: "bash", yml: "yaml", yaml: "yaml",
  json: "json", sql: "sql", tex: "latex", js: "javascript", ts: "typescript",
};

// Highlights the WHOLE text in one pass -- this keeps multi-line context
// (docstrings, block comments, multi-line strings) that per-line highlighting
// would otherwise lose -- then splits the resulting HTML back into per-line
// strings without ever cutting a <span> in half across a line break.
function highlightAndSplitByLines(text, lang) {
  let html;
  try {
    html = hljs.highlight(text, { language: lang, ignoreIllegals: true }).value;
  } catch (e) {
    html = text.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  }
  const tokens = html.split(/(<[^>]+>)/g);
  const lines = [];
  let current = "";
  const openTags = [];
  for (const token of tokens) {
    if (!token) continue;
    if (token.startsWith("<")) {
      if (token.startsWith("</")) {
        openTags.pop();
      } else if (!token.endsWith("/>")) {
        openTags.push(token);
      }
      current += token;
    } else {
      const parts = token.split("\n");
      for (let i = 0; i < parts.length; i++) {
        current += parts[i];
        if (i < parts.length - 1) {
          for (let j = openTags.length - 1; j >= 0; j--) current += "</span>";
          lines.push(current);
          current = openTags.join("");
        }
      }
    }
  }
  lines.push(current);
  return lines;
}

// Matches GitHub's heading-slug algorithm closely enough to reproduce the
// anchors already written by hand across the project's Markdown docs.
function slugify(text) {
  return text.toLowerCase().trim()
    .replace(/[^\p{L}\p{N}\p{M}\- ]+/gu, "")
    .replace(/\s+/g, "-");
}

function findById(root, id) {
  if (!id) return null;
  return Array.from(root.querySelectorAll("[id]")).find((el) => el.id === id) || null;
}

// The deck's docs link to each other with real relative paths
// (`../../sql/extraction/x.sql`, `architecture_cible.md#2-vue-...`) that only
// resolve inside the repo tree. This viewer only serves a flat symlink set
// under /refs/, so internal links are rewritten to stay inside it instead.
function rewriteInternalLink(href) {
  if (/^(https?:|mailto:|#)/i.test(href)) return null;
  const [pathPart, anchorPart] = href.split("#");
  const basename = safeDecode(pathPart.split("/").pop() || "");
  if (!basename || !FILE_EXT_RE.test(basename)) return null;
  let url = "/refs/view.html?file=" + encodeURIComponent(basename);
  if (anchorPart) url += "&anchor=" + encodeURIComponent(safeDecode(anchorPart));
  return url;
}

function rewriteImageSrc(src) {
  if (/^(https?:|data:)/i.test(src)) return null;
  const basename = safeDecode(src.split("/").pop() || "");
  return basename ? "/images/" + basename : null;
}

function wireUpContent(content, currentAnchorParam) {
  content.querySelectorAll("a[href]").forEach((a) => {
    const href = a.getAttribute("href");
    if (href.startsWith("#")) {
      a.addEventListener("click", (ev) => {
        ev.preventDefault();
        const target = findById(content, safeDecode(href.slice(1)));
        if (target) target.scrollIntoView({ block: "start" });
      });
      return;
    }
    if (/^(https?:|mailto:)/i.test(href)) {
      a.target = "_blank";
      a.rel = "noopener";
      return;
    }
    const rewritten = rewriteInternalLink(href);
    if (rewritten) {
      a.setAttribute("href", rewritten);
    } else {
      a.classList.add("broken-ref");
      a.title = "Référence hors du dépôt synchronisé avec ce visualiseur (" + href + ")";
      a.addEventListener("click", (ev) => ev.preventDefault());
    }
  });
  content.querySelectorAll("img[src]").forEach((img) => {
    const rewritten = rewriteImageSrc(img.getAttribute("src"));
    if (rewritten) img.setAttribute("src", rewritten);
  });
  if (currentAnchorParam) {
    const target = findById(content, currentAnchorParam);
    if (target) setTimeout(() => target.scrollIntoView({ block: "start" }), 50);
  }
}

async function main() {
  const { file, line, anchor } = getParams();
  const label = document.getElementById("file-label");
  const badge = document.getElementById("ext-badge");
  const status = document.getElementById("status");
  const content = document.getElementById("content");

  if (!file) {
    status.textContent = "Aucun fichier demandé (paramètre ?file= manquant).";
    return;
  }
  label.textContent = file;
  const ext = extOf(file);
  badge.textContent = ext || "texte";

  let text;
  try {
    const res = await fetch("/refs/" + file.split("/").pop());
    if (!res.ok) throw new Error("HTTP " + res.status);
    text = await res.text();
  } catch (e) {
    status.textContent = "Impossible de charger ce fichier (" + e.message + ").";
    return;
  }

  status.style.display = "none";
  content.style.display = "block";

  if (ext === "md") {
    const md = window.markdownit({ html: false, linkify: true, typographer: true });
    md.renderer.rules.fence = (tokens, idx) => {
      const token = tokens[idx];
      const lang = (token.info || "").trim().toLowerCase().split(/\s+/)[0] || "plaintext";
      if (lang === "mermaid") {
        // Rendu en diagramme interprété (mermaid.run ci-dessous), pas en bloc de code
        const escaped = token.content.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        return '<div class="mermaid">' + escaped + "</div>";
      }
      const codeLines = highlightAndSplitByLines(token.content.replace(/\n$/, ""), lang);
      return '<pre><code class="hljs language-' + lang + '">' + codeLines.join("\n") + "</code></pre>";
    };
    content.innerHTML = md.render(text);
    content.querySelectorAll("h1, h2, h3, h4, h5, h6").forEach((h) => {
      if (!h.id) h.id = slugify(h.textContent);
    });
    const mermaidBlocks = content.querySelectorAll(".mermaid");
    if (mermaidBlocks.length) {
      window.mermaid.initialize({ startOnLoad: false, theme: "neutral" });
      await window.mermaid.run({ nodes: mermaidBlocks });
    }
    wireUpContent(content, safeDecode(anchor));
  } else {
    content.classList.add("code-view");
    const lang = LANG_BY_EXT[ext] || "plaintext";
    const lines = highlightAndSplitByLines(text, lang);
    const width = String(lines.length).length;
    const rows = lines.map((l, i) => {
      const n = i + 1;
      const gutter = '<span class="ln">' + String(n).padStart(width, " ") + "</span>";
      const rowClass = n === line ? "code-row line-marker" : "code-row";
      return '<span class="' + rowClass + '" data-line="' + n + '">' + gutter + (l || " ") + "</span>";
    }).join("\n");
    const pre = document.createElement("pre");
    const code = document.createElement("code");
    code.className = "hljs language-" + lang;
    code.innerHTML = rows;
    pre.appendChild(code);
    content.appendChild(pre);
    if (line) {
      setTimeout(() => {
        const marked = content.querySelector(".line-marker");
        if (marked) marked.scrollIntoView({ block: "center" });
      }, 50);
    }
  }
}
main();
</script>
</body>
</html>
