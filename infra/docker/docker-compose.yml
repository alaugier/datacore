services:
  db:
    image: postgres:16-alpine
    container_name: datacore-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datacore_staging}
      POSTGRES_USER: ${POSTGRES_USER:-datacore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datacore}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - datacore-staging-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datacore} -d ${POSTGRES_DB:-datacore_staging}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-mock:
    build:
      context: ../../api-mock
      dockerfile: ../infra/docker/api-mock.Dockerfile
    container_name: datacore-api-mock
    restart: unless-stopped
    ports:
      - "${API_MOCK_PORT:-5050}:5050"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  omega-data-api:
    build:
      context: ../..
      dockerfile: infra/docker/omega-data-api.Dockerfile
    container_name: datacore-omega-data-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Surcharge le DSN par defaut (localhost) : a l'interieur du
      # reseau Docker Compose, la base est joignable via le nom du
      # service "db", pas localhost.
      STAGING_DB_DSN: postgresql://${POSTGRES_USER:-datacore}:${POSTGRES_PASSWORD:-datacore}@db:5432/${POSTGRES_DB:-datacore_staging}
    ports:
      - "${OMEGA_DATA_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Docker Hub a retire minio/minio des images publiques standard
    # (verifie en pratique le 22/09/2026, "pull access denied") -- quay.io
    # est desormais le registre officiel recommande par MinIO.
    image: quay.io/minio/minio:latest
    container_name: datacore-omega-lake
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-datacore}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-datacore_lake}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - datacore-omega-lake-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Conteneur "one-shot" (pas de restart) : cree le bucket unique
  # omega-lake au demarrage, puis s'arrete. raw/staging/curated ne sont
  # pas des buckets separes mais des prefixes a l'interieur de celui-ci
  # (convention documentee dans architecture_omega_lake.md §3) -- un
  # prefixe S3 n'a pas a etre cree explicitement, il apparait au premier
  # objet ecrit sous ce chemin.
  #
  # Cree aussi la politique et l'utilisateur en lecture seule (C21,
  # droits d'acces par groupe -- meme principe que bi_reader pour
  # l'entrepot, C14) : lake_reader ne peut que GetObject/ListBucket,
  # jamais ecrire. Idempotent -- verifie en relancant deux fois de
  # suite sans erreur.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: datacore-omega-lake-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ../minio:/policies:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-datacore} ${MINIO_ROOT_PASSWORD:-datacore_lake} &&
      mc mb --ignore-existing local/omega-lake &&
      mc admin policy create local lake-reader /policies/lake-reader-policy.json &&
      mc admin user add local ${LAKE_READER_USER:-lake_reader} ${LAKE_READER_PASSWORD:-datacore_lake_reader} &&
      mc admin policy attach local lake-reader --user ${LAKE_READER_USER:-lake_reader}
      "

  # Restitution BI (C16bis) : outil de BI dedie plutot que le notebook
  # seul (retour de formateur, voir gestion_operationnelle_omega_bi.md
  # §3.5) -- auto-heberge, comme le reste de l'infra locale (sobriete
  # RGESN), connecte en lecture seule via bi_reader (C14), jamais avec
  # les identifiants admin Postgres.
  grafana:
    image: grafana/grafana-oss:latest
    container_name: datacore-grafana
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-datacore_grafana}
      # Repris par le provisioning de la source de donnees (voir
      # infra/grafana/provisioning/datasources) -- Grafana substitue les
      # variables d'environnement $VAR dans ses fichiers de provisioning.
      GF_OMEGA_BI_DB: ${OMEGA_BI_DB:-datacore_omega_bi}
      GF_BI_READER_PASSWORD: ${BI_READER_PASSWORD:-datacore_bi_reader}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - datacore-grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\": \"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Capteur SMTP local (C20bis) : recoit les e-mails d'alerte envoyes
  # par alerting-webhook (smtplib) sans jamais les faire sortir vers un
  # vrai fournisseur externe -- interface web pour visualiser les
  # e-mails recus, API REST pour les tests d'integration.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: datacore-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_API_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v2/messages"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Relais alerte Grafana -> e-mail reel (C20bis) : recoit le webhook
  # d'une regle d'alerte Grafana (rupture de service detectee sur
  # monitoring.sante_infrastructure/catalogue_lake) et envoie un e-mail
  # via smtplib vers mailhog -- voir src/datacore/alerting/webhook.py
  # pour la justification (pas de vrai compte email externe).
  alerting-webhook:
    build:
      context: ../..
      dockerfile: infra/docker/alerting-webhook.Dockerfile
    container_name: datacore-alerting-webhook
    restart: unless-stopped
    depends_on:
      mailhog:
        condition: service_healthy
    environment:
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    ports:
      - "${ALERTING_WEBHOOK_PORT:-5060}:5060"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5060/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  datacore-staging-data:
  datacore-omega-lake-data:
  datacore-grafana-data:
