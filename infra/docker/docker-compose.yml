services:
  db:
    image: postgres:16-alpine
    container_name: datacore-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datacore_staging}
      POSTGRES_USER: ${POSTGRES_USER:-datacore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datacore}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - datacore-staging-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datacore} -d ${POSTGRES_DB:-datacore_staging}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-mock:
    build:
      context: ../../api-mock
      dockerfile: ../infra/docker/api-mock.Dockerfile
    container_name: datacore-api-mock
    restart: unless-stopped
    ports:
      - "${API_MOCK_PORT:-5050}:5050"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  omega-data-api:
    build:
      context: ../..
      dockerfile: infra/docker/omega-data-api.Dockerfile
    container_name: datacore-omega-data-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Surcharge le DSN par defaut (localhost) : a l'interieur du
      # reseau Docker Compose, la base est joignable via le nom du
      # service "db", pas localhost.
      STAGING_DB_DSN: postgresql://${POSTGRES_USER:-datacore}:${POSTGRES_PASSWORD:-datacore}@db:5432/${POSTGRES_DB:-datacore_staging}
    ports:
      - "${OMEGA_DATA_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Docker Hub a retire minio/minio des images publiques standard
    # (verifie en pratique le 22/09/2026, "pull access denied") -- quay.io
    # est desormais le registre officiel recommande par MinIO.
    image: quay.io/minio/minio:latest
    container_name: datacore-omega-lake
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-datacore}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-datacore_lake}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - datacore-omega-lake-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Conteneur "one-shot" (pas de restart) : cree le bucket unique
  # omega-lake au demarrage, puis s'arrete. raw/staging/curated ne sont
  # pas des buckets separes mais des prefixes a l'interieur de celui-ci
  # (convention documentee dans architecture_omega_lake.md §3) -- un
  # prefixe S3 n'a pas a etre cree explicitement, il apparait au premier
  # objet ecrit sous ce chemin.
  #
  # Cree aussi la politique et l'utilisateur en lecture seule (C21,
  # droits d'acces par groupe -- meme principe que bi_reader pour
  # l'entrepot, C14) : lake_reader ne peut que GetObject/ListBucket,
  # jamais ecrire. Idempotent -- verifie en relancant deux fois de
  # suite sans erreur.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: datacore-omega-lake-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ../minio:/policies:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-datacore} ${MINIO_ROOT_PASSWORD:-datacore_lake} &&
      mc mb --ignore-existing local/omega-lake &&
      mc admin policy create local lake-reader /policies/lake-reader-policy.json &&
      mc admin user add local ${LAKE_READER_USER:-lake_reader} ${LAKE_READER_PASSWORD:-datacore_lake_reader} &&
      mc admin policy attach local lake-reader --user ${LAKE_READER_USER:-lake_reader}
      "

  # Restitution BI (C16bis) : outil de BI dedie plutot que le notebook
  # seul (retour de formateur, voir gestion_operationnelle_omega_bi.md
  # §3.5) -- auto-heberge, comme le reste de l'infra locale (sobriete
  # RGESN), connecte en lecture seule via bi_reader (C14), jamais avec
  # les identifiants admin Postgres.
  grafana:
    image: grafana/grafana-oss:latest
    container_name: datacore-grafana
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-datacore_grafana}
      # Repris par le provisioning de la source de donnees (voir
      # infra/grafana/provisioning/datasources) -- Grafana substitue les
      # variables d'environnement $VAR dans ses fichiers de provisioning.
      GF_OMEGA_BI_DB: ${OMEGA_BI_DB:-datacore_omega_bi}
      GF_BI_READER_PASSWORD: ${BI_READER_PASSWORD:-datacore_bi_reader}
      # Repris par le provisioning de l'alerte (voir
      # infra/grafana/provisioning/alerting) pour authentifier le
      # webhook envoye a alerting-webhook.
      GF_ALERTING_WEBHOOK_SECRET: ${ALERTING_WEBHOOK_SECRET:-datacore-alerting-2026}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - datacore-grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\": \"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Gestionnaire de base de donnees en navigateur (Adminer) : alternative
  # 100% web a DBeaver pour montrer schemas/tables/donnees en demo, sans
  # rien installer sous WSL -- localhost:<port> depuis n'importe quel
  # navigateur. Image officielle, un seul fichier PHP (~500 Ko) -- meme
  # principe de sobriete que MailHog/Grafana (auto-heberge, pas de
  # service tiers). Connexion a la base au login (pas d'identifiants
  # presaisis) : Systeme "PostgreSQL", Serveur "db", identifiants dans
  # .env (POSTGRES_USER/PASSWORD), Base "datacore_staging" ou
  # "datacore_omega_bi" selon ce qu'on veut montrer.
  adminer:
    image: adminer:latest
    container_name: datacore-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8081}:8080"

  # Capteur SMTP local (C20bis) : recoit les e-mails d'alerte envoyes
  # par alerting-webhook (smtplib) sans jamais les faire sortir vers un
  # vrai fournisseur externe -- interface web pour visualiser les
  # e-mails recus, API REST pour les tests d'integration.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: datacore-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_API_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v2/messages"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Relais alerte Grafana -> e-mail reel (C20bis) : recoit le webhook
  # d'une regle d'alerte Grafana (rupture de service detectee sur
  # monitoring.sante_infrastructure/catalogue_lake) et envoie un e-mail
  # via smtplib vers mailhog -- voir src/datacore/alerting/webhook.py
  # pour la justification (pas de vrai compte email externe).
  alerting-webhook:
    build:
      context: ../..
      dockerfile: infra/docker/alerting-webhook.Dockerfile
    container_name: datacore-alerting-webhook
    restart: unless-stopped
    depends_on:
      mailhog:
        condition: service_healthy
    environment:
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      ALERTING_WEBHOOK_SECRET: ${ALERTING_WEBHOOK_SECRET:-datacore-alerting-2026}
    ports:
      - "${ALERTING_WEBHOOK_PORT:-5060}:5060"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5060/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DAG Airflow (issue #100, stretch goal optionnel -- voir
  # airflow.Dockerfile et infra/airflow/dags/datacore_pipeline.py).
  # Profil dedie ("airflow") : jamais demarre par un simple
  # `docker compose up -d` sans l'option --profile, pour ne jamais
  # impacter le reste du livrable si ca n'avance pas (perimetre strict
  # de l'issue). `airflow standalone` : scheduler + DAG processor +
  # API server + triggerer dans un seul conteneur, SQLite (LocalExecutor
  # fonctionne desormais avec SQLite depuis Airflow 3 -- plus besoin
  # d'un second Postgres, coherent avec la sobriete numerique deja
  # retenue partout ailleurs dans ce projet).
  airflow:
    build:
      context: ../..
      dockerfile: infra/docker/airflow.Dockerfile
    container_name: datacore-airflow
    profiles: ["airflow"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api-mock:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # Memes surcharges que omega-data-api (voir plus haut) : a
      # l'interieur du reseau Docker Compose, les autres services sont
      # joignables par leur nom, pas par localhost.
      STAGING_DB_DSN: postgresql://${POSTGRES_USER:-datacore}:${POSTGRES_PASSWORD:-datacore}@db:5432/${POSTGRES_DB:-datacore_staging}
      OMEGA_BI_DB_DSN: postgresql://${POSTGRES_USER:-datacore}:${POSTGRES_PASSWORD:-datacore}@db:5432/${OMEGA_BI_DB:-datacore_omega_bi}
      # storage/lake/transform.py (C18) ne lit pas les DSN ci-dessus --
      # il reconstruit sa propre chaine ATTACH DuckDB a partir de
      # POSTGRES_HOST (voir config.py).
      POSTGRES_HOST: db
      TRANSFLOW_API_URL: http://api-mock:5050
      API_KEY: ${API_KEY:-datacore-training-2026}
      OMEGA_LAKE_S3_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-datacore}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-datacore_lake}
      OMEGA_LAKE_BUCKET: ${OMEGA_LAKE_BUCKET:-omega-lake}
      LAKE_PSEUDONYM_KEY: ${LAKE_PSEUDONYM_KEY:?LAKE_PSEUDONYM_KEY doit etre definie dans .env (voir .env.example) -- requise par curated_bi (C21bis)}
      # Protection si la base de metadonnees est un jour recreee vierge
      # (ex. volume d'etat supprime manuellement) : le DAG serait sinon
      # importe en pause par defaut, bloquant tout declenchement manuel
      # tant qu'on ne va pas le depauser a la main dans l'UI.
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      # Base SQLite + mot de passe "Simple auth manager" deplaces dans
      # /opt/airflow/state (voir airflow.Dockerfile) : seul ce sous-dossier
      # est persiste (volume plus bas), jamais dags/ -- sinon le conteneur
      # continue de servir une version perimee du DAG apres reconstruction
      # de l'image (verifie empiriquement). Benefice : l'utilisateur admin
      # et son mot de passe survivent desormais aux redemarrages.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/state/simple_auth_manager_passwords.json.generated
    command: standalone
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - datacore-airflow-state:/opt/airflow/state
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  datacore-staging-data:
  datacore-omega-lake-data:
  datacore-grafana-data:
  datacore-airflow-state:
