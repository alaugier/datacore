# Configuration Alembic de l'entrepot OMEGA BI (C14), distincte de
# alembic.ini (base de staging, C11) : deux bases Postgres separees, donc
# deux historiques de migration independants. Invocation :
#   alembic -c alembic_omega_bi.ini upgrade head

[alembic]
script_location = %(here)s/src/datacore/storage/warehouse/migrations

prepend_sys_path = .

path_separator = os

# database URL. Volontairement absente ici : env.py la definit
# dynamiquement depuis datacore.ingestion.config.OMEGA_BI_DB_DSN (qui lit
# .env via python-dotenv), meme principe qu'alembic.ini.


[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
